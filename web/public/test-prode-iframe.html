<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Incrustación iFrame - Data eNe</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    iframe {
      width: 100%;
      height: 1100px;
      border: none;
      border-radius: 12px;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <h1>Página de Ejemplo de Data eNe</h1>
    <p>Prueba de incrustación segura del Prode a través de iFrame</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Sección de Deportes & Prode Oficial</h2>
      <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">
        A continuación se renderiza el iFrame exacto que Vorks utilizará en la web:
      </p>

      <!-- CÓDIGO EXACTO DEL IFRAME -->
      <iframe 
        src="https://widget-futbol-muove.vercel.app/prode" 
        allow="clipboard-write">
      </iframe>
    </div>
  </div>

  <footer>
    <p>© 2026 Data eNe - Todos los derechos reservados.</p>
  </footer>

</body>
</html>
